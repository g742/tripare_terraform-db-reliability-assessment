services:
  postgres:
    image: postgres:16
    container_name: hotel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/seed/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro

volumes:
  postgres_data:
